# Activate with: --spring.profiles.active=postgres   (requires Docker running)
# Spring Boot starts the services in compose.yaml and wires the datasource automatically.
spring.docker.compose.enabled=true
spring.docker.compose.file=compose.yaml
spring.docker.compose.lifecycle-management=start-only
spring.datasource.url=jdbc:postgresql://localhost:15432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
