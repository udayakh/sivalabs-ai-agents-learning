spring.application.name=review-buddy

####### Web #######
spring.threads.virtual.enabled=true
server.compression.enabled=true
server.shutdown=graceful
spring.thymeleaf.cache=false

####### Database #######
# Default = embedded H2 file database (zero setup, data survives restarts in ./data).
# Run with profile "postgres" to use PostgreSQL started automatically from compose.yaml.
spring.datasource.url=jdbc:h2:file:./data/reviewbuddy;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.docker.compose.enabled=false

####### JPA best practices #######
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

####### Flyway #######
spring.flyway.locations=classpath:db/migration

####### Spring Modulith (event publication registry = transactional outbox) #######
spring.modulith.events.jdbc.schema-initialization.enabled=true
spring.modulith.events.republish-outstanding-events-on-restart=true

####### Actuator #######
management.endpoints.web.exposure.include=health,info

####### Spring AI #######
# Disabled by default so the app runs without any API key (rule based summaries are used).
# Enable with profile "ai" and environment variable OPENAI_API_KEY.
spring.ai.model.chat=none
spring.ai.chat.client.enabled=false
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
spring.ai.openai.api-key=${OPENAI_API_KEY:not-configured}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-4.1-mini}
spring.ai.openai.chat.options.temperature=0.3
# "retry failed requests twice" -> 1 attempt + 2 retries
spring.ai.retry.max-attempts=3

####### Application #######
app.ai.summary.min-reviews=3
