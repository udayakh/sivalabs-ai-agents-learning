<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body class="min-h-screen">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="max-w-md mx-auto px-4 py-12">
    <div class="bg-white rounded-xl border border-emerald-100 p-8">
        <h1 class="text-2xl font-bold mb-6">Welcome back</h1>
        <p th:if="${param.error}" class="mb-4 rounded-lg bg-red-50 text-red-700 px-4 py-3">Invalid email or password.</p>
        <p th:if="${param.registered}" class="mb-4 rounded-lg bg-emerald-50 text-emerald-700 px-4 py-3">Registration successful. Please log in.</p>
        <form th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium mb-1">Email</label>
                <input id="username" name="username" type="email" class="input" required autofocus>
            </div>
            <div>
                <label for="password" class="block text-sm font-medium mb-1">Password</label>
                <input id="password" name="password" type="password" class="input" required>
            </div>
            <button type="submit" class="w-full rounded-lg bg-emerald-600 text-white px-5 py-2 hover:bg-emerald-700">Login</button>
        </form>
        <p class="mt-6 text-sm text-gray-600">No account? <a th:href="@{/registration}" class="text-emerald-700 underline">Sign up</a></p>
        <p class="mt-2 text-xs text-gray-400">Demo: user@gmail.com / user · admin@gmail.com / admin</p>
    </div>
</main>
</body>
</html>
