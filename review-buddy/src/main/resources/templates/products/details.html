<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${product.name})}"></head>
<body class="min-h-screen">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="max-w-4xl mx-auto px-4 py-8">
    <a th:href="@{/products}" class="text-sm text-emerald-700 hover:underline">&larr; All products</a>

    <section class="mt-4 bg-white rounded-xl border border-emerald-100 overflow-hidden">
        <div class="h-56 bg-emerald-100 flex items-center justify-center text-6xl font-bold text-emerald-600 relative">
            <span th:text="${product.name.substring(0, 1)}">P</span>
            <img th:if="${product.imageUrl != null}" th:src="${product.imageUrl}" th:alt="${product.name}"
                 class="absolute inset-0 w-full h-full object-cover" onerror="this.remove()">
        </div>
        <div class="p-6">
            <div class="flex flex-wrap justify-between gap-4">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900" th:text="${product.name}">Product</h1>
                    <p class="text-gray-600 mt-1" th:text="${product.tagline}">Tagline</p>
                </div>
                <a th:href="${product.websiteUrl}" target="_blank" rel="noopener noreferrer"
                   class="self-start rounded-lg bg-emerald-600 text-white px-4 py-2 hover:bg-emerald-700">Visit website</a>
            </div>
            <div class="mt-4 flex flex-wrap items-center gap-3 text-sm">
                <span class="bg-emerald-50 text-emerald-700 px-2 py-1 rounded-full" th:text="${product.category.name}">Category</span>
                <span th:replace="~{fragments/layout :: stars(${product.stars()})}"></span>
                <span class="text-gray-500" id="rating-stats"
                      th:text="${#numbers.formatDecimal(product.averageRating, 1, 1)} + ' average · ' + ${product.reviewCount} + ' reviews'">4.5</span>
                <span class="text-gray-500" th:if="${product.submittedByName != null}"
                      th:text="'by ' + ${product.submittedByName}">by maker</span>
            </div>
            <p class="mt-4 text-gray-800 whitespace-pre-line" th:text="${product.description}">Description</p>
        </div>
    </section>

    <section class="mt-6 rounded-xl border border-emerald-200 bg-gradient-to-br from-emerald-50 to-white p-6" id="ai-summary">
        <h2 class="font-semibold text-emerald-800 flex items-center gap-2">✨ What people are saying</h2>
        <th:block th:if="${summary != null}">
            <p class="mt-2 text-gray-800" th:text="${summary.summary}">Summary</p>
            <p class="mt-2 text-xs text-gray-500"
               th:text="'Based on ' + ${summary.reviewCount} + ' reviews · generated by ' + ${summary.generatedBy}">meta</p>
        </th:block>
        <p th:if="${summary == null}" class="mt-2 text-gray-600"
           th:text="'An AI summary appears once this product has at least ' + ${minReviews} + ' reviews.'">No summary</p>
    </section>

    <section class="mt-6" id="reviews">
        <h2 class="text-xl font-semibold text-gray-900 mb-4" th:text="'Reviews (' + ${reviews.size()} + ')'">Reviews</h2>

        <p th:if="${successMessage}" th:text="${successMessage}"
           class="mb-4 rounded-lg bg-emerald-100 text-emerald-800 px-4 py-3">Saved</p>

        <div class="bg-white rounded-xl border border-emerald-100 p-6 mb-6">
            <form th:if="${canReview}" th:action="@{/products/{slug}/reviews(slug=${product.slug})}"
                  th:object="${form}" method="post" class="space-y-4">
                <h3 class="font-semibold">Write a review</h3>
                <p class="field-error" th:if="${#fields.hasGlobalErrors()}" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
                <div>
                    <label for="rating" class="block text-sm font-medium mb-1">Rating</label>
                    <select id="rating" th:field="*{rating}" class="input md:w-40">
                        <option th:each="i : ${#numbers.sequence(5, 1, -1)}" th:value="${i}" th:text="${i} + ' ★'">5</option>
                    </select>
                    <p class="field-error" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></p>
                </div>
                <div>
                    <label for="likes" class="block text-sm font-medium mb-1">What do you like?</label>
                    <textarea id="likes" th:field="*{likes}" rows="3" class="input" maxlength="1000"></textarea>
                    <p class="field-error" th:if="${#fields.hasErrors('likes')}" th:errors="*{likes}"></p>
                </div>
                <div>
                    <label for="improvements" class="block text-sm font-medium mb-1">What could be improved? (optional)</label>
                    <textarea id="improvements" th:field="*{improvements}" rows="3" class="input" maxlength="1000"></textarea>
                    <p class="field-error" th:if="${#fields.hasErrors('improvements')}" th:errors="*{improvements}"></p>
                </div>
                <button type="submit" class="rounded-lg bg-emerald-600 text-white px-5 py-2 hover:bg-emerald-700">Publish review</button>
            </form>
            <p th:unless="${canReview}" class="text-gray-600">
                <span th:text="${reviewBlockedReason}">Log in to write a review.</span>
                <a sec:authorize="isAnonymous()" th:href="@{/login}" class="text-emerald-700 underline">Login</a>
            </p>
        </div>

        <p th:if="${reviews.isEmpty()}" class="text-gray-600">No reviews yet. Be the first!</p>
        <article th:each="r : ${reviews}" class="review bg-white rounded-xl border border-emerald-100 p-5 mb-4">
            <div class="flex justify-between">
                <strong th:text="${r.userName}">User</strong>
                <span th:replace="~{fragments/layout :: stars(${r.rating})}"></span>
            </div>
            <p class="mt-2 text-gray-800"><span class="font-medium text-emerald-700">👍 Likes:</span>
                <span th:text="${r.likes}">likes</span></p>
            <p th:if="${r.improvements != null}" class="mt-1 text-gray-800">
                <span class="font-medium text-amber-700">🛠 Improve:</span>
                <span th:text="${r.improvements}">improvements</span></p>
        </article>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
