<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Submit product')}"></head>
<body class="min-h-screen">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="max-w-2xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-900 mb-1">Submit your product</h1>
    <p class="text-gray-600 mb-6">Share what you built with the community.</p>

    <form th:action="@{/products}" th:object="${form}" method="post"
          class="bg-white rounded-xl border border-emerald-100 p-6 space-y-4">
        <div>
            <label for="name" class="block text-sm font-medium mb-1">Name</label>
            <input id="name" th:field="*{name}" class="input" maxlength="100">
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>
        <div>
            <label for="tagline" class="block text-sm font-medium mb-1">Tagline</label>
            <input id="tagline" th:field="*{tagline}" class="input" maxlength="150">
            <p class="field-error" th:if="${#fields.hasErrors('tagline')}" th:errors="*{tagline}"></p>
        </div>
        <div>
            <label for="description" class="block text-sm font-medium mb-1">Description</label>
            <textarea id="description" th:field="*{description}" rows="5" class="input" maxlength="2000"></textarea>
            <p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
        </div>
        <div>
            <label for="websiteUrl" class="block text-sm font-medium mb-1">Website URL</label>
            <input id="websiteUrl" th:field="*{websiteUrl}" class="input" placeholder="https://">
            <p class="field-error" th:if="${#fields.hasErrors('websiteUrl')}" th:errors="*{websiteUrl}"></p>
        </div>
        <div>
            <label for="imageUrl" class="block text-sm font-medium mb-1">Image URL (optional)</label>
            <input id="imageUrl" th:field="*{imageUrl}" class="input" placeholder="https://">
            <p class="field-error" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></p>
        </div>
        <div>
            <label for="categoryId" class="block text-sm font-medium mb-1">Category</label>
            <select id="categoryId" th:field="*{categoryId}" class="input">
                <option value="">-- Select category --</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">Category</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></p>
        </div>
        <button type="submit" class="rounded-lg bg-emerald-600 text-white px-5 py-2 hover:bg-emerald-700">Submit product</button>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
