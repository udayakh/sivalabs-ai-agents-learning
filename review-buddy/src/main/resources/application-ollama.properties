# Profile 'ollama': free, local LLM summaries (no API key, no cost).
# Prerequisites: install Ollama (https://ollama.com) and run `ollama pull llama3.2:3b`.
# Same SpringAiReviewSummarizer code as the 'ai' (OpenAI) profile - only the provider changes.
spring.ai.model.chat=ollama
spring.ai.chat.client.enabled=true
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_CHAT_MODEL:llama3.2:3b}
# Local models can be slow on CPU; fail fast to the rule-based fallback if Ollama is down.
spring.ai.retry.max-attempts=2
